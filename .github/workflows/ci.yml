name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        harness: [ON, OFF]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && matrix.harness == 'ON'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Install macOS LLVM
        if: runner.os == 'macOS' && matrix.harness == 'ON'
        run: brew install llvm

      - name: Configure
        shell: bash
        run: |
          cmake_args=(
            -B build
            -DCMAKE_BUILD_TYPE=Release
            -DCHRONICLE_WERROR=ON
            -DCHRONICLE_ENABLE_HARNESS=${{ matrix.harness }}
          )

          if [[ "${RUNNER_OS}" == "macOS" && "${{ matrix.harness }}" == "ON" ]]; then
            llvm_prefix="$(brew --prefix llvm)"
            cmake_args+=(
              -DCMAKE_C_COMPILER="${llvm_prefix}/bin/clang"
              -DCMAKE_CXX_COMPILER="${llvm_prefix}/bin/clang++"
            )
          fi

          cmake "${cmake_args[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Validate bundled scenario
        run: ./build/src/chronicle validate --scenario data

      - name: Validate lighthouse example
        run: ./build/src/chronicle validate --scenario examples/lighthouse_veil

      - name: Validate minimal starter example
        run: ./build/src/chronicle validate --scenario examples/minimal_scenario
