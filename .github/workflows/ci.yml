name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: formatting
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Formatting
        run: |
          clang-format --dry-run --Werror src/main.cpp src/chronicle/*.hpp src/chronicle/*.cpp \
            src/chronicle/*/*.hpp src/chronicle/*/*.cpp tests/*.hpp tests/*.cpp \
            tests/integration/*.cpp

  ci:
    name: build-test (ubuntu, gcc-16)
    runs-on: ubuntu-26.04
    # scry and Scrydantic require GCC 16.2, and Ubuntu 26.04 packages only a
    # 16.0.1 snapshot, so this job runs in the official GCC image, pinned by
    # digest. The image calls its compilers gcc and g++, so the configure steps
    # override the names in the presets.
    container:
      image: gcc:16.2.0@sha256:07280eb2e744f1b7a2d8d4a3894c089ea07266c109758afc388a634bd098e4eb
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake libcurl4-openssl-dev

      - name: Configure
        run: cmake --preset linux-ci -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build --preset linux-ci -j "$(nproc)"

      - name: Unit tests
        run: ctest --preset linux-ci

      - name: Validate bundled examples
        run: |
          ./build-linux-ci/src/chronicle validate --scenario examples/minimal
          ./build-linux-ci/src/chronicle validate --scenario examples/broken_wheel
          ./build-linux-ci/src/chronicle inspect --scenario examples/minimal > /dev/null

      - name: Release build and relocatable install smoke
        run: |
          cmake --preset release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build --preset release -j "$(nproc)"
          cmake --install build-release --prefix "$RUNNER_TEMP/chronicle"
          "$RUNNER_TEMP/chronicle/bin/chronicle" --version
          cd "$RUNNER_TEMP"
          printf 'quit\n' | "$RUNNER_TEMP/chronicle/bin/chronicle" > /dev/null
