name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: build-test (ubuntu, gcc-16)
    runs-on: ubuntu-26.04
    env:
      CC: gcc-16
      CXX: g++-16

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-16 libcurl4-openssl-dev

      - name: Configure
        run: cmake --preset dev -DCHRONICLE_WERROR=ON

      - name: Build
        run: cmake --build --preset dev -j "$(nproc)"

      - name: Unit tests
        run: ctest --preset dev

      - name: Validate bundled examples
        run: |
          ./build/src/chronicle validate --scenario examples/minimal
          ./build/src/chronicle validate --scenario examples/broken_wheel
          ./build/src/chronicle inspect --scenario examples/minimal > /dev/null
